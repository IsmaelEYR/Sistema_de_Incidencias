<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — {{ hospital_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <style>
        body.login-body { background: radial-gradient(circle at 20% 10%, #ccfbf1 0, transparent 40%), radial-gradient(circle at 90% 90%, #e0f2fe 0, transparent 40%), #f8fafc; }
        .login-card { width: 100%; max-width: 420px; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 60px rgba(15,23,42,.10); }
        .login-card h3 { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.01em; }
    </style>
</head>
<body class="login-body d-flex align-items-center justify-content-center vh-100">
    <div class="card login-card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3" style="width:60px;height:60px;font-size:2rem;">🏥</div>
                <h3>{{ hospital_name }}</h3>
                <p class="text-muted">Acceso de supervisores</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            
            <form method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-teal w-100">Ingresar</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="/dashboard" class="btn btn-outline-secondary w-100">← Volver al Panel de Control</a>
            </div>
        </div>
    </div>
</body>
</html>
