{% extends "base.html" %}

{% block title %}Error {{ status_code }}{% endblock %}

{% block content %}
<div class="page-container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card-hospital">
                <div class="card-header-custom">
                    <h3>{% if status_code == 403 %}🔒 Acceso restringido{% elif status_code == 404 %}🔎 No encontrado{% else %}⚠️ Error {{ status_code }}{% endif %}</h3>
                </div>
                <div class="card-body p-4">
                    <div class="alert alert-danger">{{ detail }}</div>
                    <a href="/panel" class="btn btn-teal w-100">Volver al Panel de Control</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
